[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "qanuntrace"
version = "0.2.1"
description = "Source-grounded legal retrieval and exact-quote verification pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Shehata El-sayed"}]
keywords = ["legal", "retrieval", "arabic", "evidence", "rag"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Operating System :: OS Independent"]
dependencies = []
[project.urls]
Homepage = "https://github.com/ShehataElsayed/qanuntrace"
Documentation = "https://github.com/ShehataElsayed/qanuntrace/blob/main/docs/INTEGRATION.md"
Repository = "https://github.com/ShehataElsayed/qanuntrace"
Issues = "https://github.com/ShehataElsayed/qanuntrace/issues"
[project.optional-dependencies]
sql = ["sqlalchemy>=2,<3"]
elastic = ["elasticsearch>=8,<10"]
opensearch = ["opensearch-py>=2,<4"]
vector = ["chromadb>=0.5,<2", "qdrant-client>=1.9,<2"]
mongo = ["pymongo>=4,<5"]
openai = ["openai>=1,<3"]
anthropic = ["anthropic>=0.35,<1"]
google = ["google-genai>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.7,<1", "mypy>=1.10,<2"]
ingest = ["pypdf>=5,<7", "python-docx>=1,<2", "openpyxl>=3,<4"]
hijri = ["hijridate>=2,<3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
[project.scripts]
qanuntrace-doctor = "qanuntrace.cli:main"
